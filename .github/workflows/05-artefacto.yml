name: artefactos

on:
  push: 
    branches: [develop, 'feature/**']
  
  workflow_dispatch:

concurrency: 
  group: revisar-${{ github.workflow }}-${{ github.ref }} 
  cancel-in-progress: true
jobs: 
    genera-Artefacto:
      runs-on: ubuntu-latest
      steps:
        - name: crear texto de prueba
          run: echo "Hola, soy un artefacto" > prueba.txt
        
        - name: subirArtefacto
          uses: actions/upload-artifact@v4
          with:
            name: artefacto-prueba
            path: prueba.txt

    prueba-Artefacto:
      needs: genera-Artefacto
      runs-on: ubuntu-latest
      steps: 
        - name: descargo el artefacto
          uses: actions/download-artifact@v8
          with: 
            name: artefacto-prueba

        - name: comprobar existencia
          run: cat prueba.txt